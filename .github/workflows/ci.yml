name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Static checks
        run: |
          ruff check backend
          mypy backend/app --ignore-missing-imports
      - name: Tests and safety audit
        env:
          CREDENTIAL_ENCRYPTION_KEY: "TTnYEol6gSAAV6xIIUrsEtNVJw7m7yTAZCICTaiQHC8="
        run: |
          python -m pytest backend/tests backend/evals --cov=backend/app --cov=backend/evals --cov-fail-under=80
          PYTHONPATH=backend python -m app.tools.registry --validate-all-schemas
          PYTHONPATH=backend python -m app.safety.audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
